cargo-features = ["panic-immediate-abort"]

[package]
name = "ascalon-client"
version = "0.1.0"
edition = "2024"
description = "Unofficial Guild Wars 2 client"
license = "MIT"
repository = "https://github.com/valaphee/ascalon-client"

[dependencies]
bitflags = "2"

bevy = { version = "0.20", features = ["2d", "3d", "ui", "free_camera"] }

ascalon-asset = { git = "https://github.com/valaphee/ascalon.git", rev = "91754318cc8d643cc29d4e14ddb86e4b0824cb0b" }
ascalon-network = { git = "https://github.com/valaphee/ascalon.git", rev = "91754318cc8d643cc29d4e14ddb86e4b0824cb0b" }
ascalon-protocol = { git = "https://github.com/valaphee/ascalon.git", rev = "91754318cc8d643cc29d4e14ddb86e4b0824cb0b" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
