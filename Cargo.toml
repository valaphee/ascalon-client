cargo-features = ["panic-immediate-abort"]

[package]
name = "ascalon-client"
version = "0.1.0"
edition = "2024"
description = "Unofficial Guild Wars 2 client"
license = "MIT"
repository = "https://github.com/valaphee/ascalon-client"

[dependencies]
bitflags = "2"
uuid = "1"
zerocopy = "0.8"

bevy = { git = "https://github.com/bevyengine/bevy.git", rev = "1a6377e33b26b6d744f96e35dbe9392e86602ac3", features = ["2d", "3d", "ui", "free_camera"] }

ascalon-asset = { git = "https://github.com/valaphee/ascalon.git", rev = "2d5c7c528a51bf25e6d965b1f47d7602db1ee473" }
ascalon-network = { git = "https://github.com/valaphee/ascalon.git", rev = "2d5c7c528a51bf25e6d965b1f47d7602db1ee473" }
ascalon-protocol = { git = "https://github.com/valaphee/ascalon.git", rev = "2d5c7c528a51bf25e6d965b1f47d7602db1ee473" }

[profile.dev]
opt-level = 1
debug = false

[profile.dev.package."*"]
opt-level = 3

[profile.release]
#lto = true
codegen-units = 1
panic = "immediate-abort"
strip = "symbols"
