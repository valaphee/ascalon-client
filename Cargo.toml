cargo-features = ["panic-immediate-abort"]

[package]
name = "ascalon-client"
version = "0.1.0"
edition = "2024"

[features]
dev = ["bevy/free_camera"]

[dependencies]
uuid = "1"
zerocopy = "0.8"

bevy = { git = "https://github.com/bevyengine/bevy.git", rev = "1a6377e33b26b6d744f96e35dbe9392e86602ac3", features = ["2d", "3d", "ui"] }

ascalon-asset = { path = "../ascalon/asset" }
#ascalon-asset = { git = "https://github.com/valaphee/ascalon.git", rev = "bcc56ae402ad5f943dbc42491fd1225ad699b5a0" }
ascalon-network = { git = "https://github.com/valaphee/ascalon.git", rev = "bcc56ae402ad5f943dbc42491fd1225ad699b5a0" }
ascalon-protocol = { git = "https://github.com/valaphee/ascalon.git", rev = "bcc56ae402ad5f943dbc42491fd1225ad699b5a0" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
panic = "immediate-abort"
codegen-units = 1
