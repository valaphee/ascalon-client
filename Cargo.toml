cargo-features = ["panic-immediate-abort"]

[package]
name = "ascalon-client"
version = "0.1.0"
edition = "2024"
description = "Unofficial Guild Wars 2 client"
license = "MIT"
repository = "https://github.com/valaphee/ascalon-client"

[dependencies]
bitflags = "2"

bevy = { version = "0.20", features = ["2d", "3d", "ui", "free_camera"] }

ascalon-asset = { git = "https://github.com/valaphee/ascalon.git", rev = "fe85a8c09f21294e76f42be2c3ea7c22404fd641" }
ascalon-network = { git = "https://github.com/valaphee/ascalon.git", rev = "fe85a8c09f21294e76f42be2c3ea7c22404fd641" }
ascalon-protocol = { git = "https://github.com/valaphee/ascalon.git", rev = "fe85a8c09f21294e76f42be2c3ea7c22404fd641" }

[profile.dev]
opt-level = 1
debug = false

[profile.dev.package."*"]
opt-level = 3

[profile.release]
#lto = true
codegen-units = 1
panic = "immediate-abort"
strip = "symbols"
